<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Pathshala Pocket teacher dashboard concept</title>
  <desc id="desc">Static concept for a teacher dashboard showing class learning progress, students needing support, and offline lesson packs. All figures are illustrative.</desc>
  <defs>
    <style>
      .ui{font-family:Arial,Helvetica,sans-serif;fill:#25344a}.muted{fill:#758094}.tiny{font-size:13px}.small{font-size:15px}.body{font-size:17px}.medium{font-size:19px;font-weight:600}.heading{font-size:27px;font-weight:700}.card{fill:#fff;stroke:#e8ebf0;stroke-width:2}.blue{fill:#496fc3}.lightblue{fill:#eaf0ff}.green{fill:#2f8f74}.lightgreen{fill:#e6f5ef}.orange{fill:#e88c3a}.lightorange{fill:#fff1e3}
    </style>
  </defs>
  <rect width="1440" height="900" fill="#f5f7fb"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="900" fill="#fff"/>
  <path d="M250 0v900" stroke="#e8ebf0" stroke-width="2"/>
  <circle cx="48" cy="48" r="22" fill="#496fc3"/>
  <path d="M38 51q10-22 20 0M39 57h18" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="82" y="45" class="ui medium">Pathshala</text><text x="82" y="68" class="ui small muted">POCKET</text>
  <rect x="18" y="115" width="214" height="52" rx="12" fill="#eaf0ff"/>
  <text x="48" y="148" class="ui body" fill="#345ba8">▦</text><text x="73" y="148" class="ui body" fill="#345ba8">Overview</text>
  <text x="48" y="216" class="ui body muted">▤</text><text x="73" y="216" class="ui body muted">My Class</text>
  <text x="48" y="278" class="ui body muted">▣</text><text x="73" y="278" class="ui body muted">Lesson Packs</text>
  <text x="48" y="340" class="ui body muted">◷</text><text x="73" y="340" class="ui body muted">Sync Status</text>
  <path d="M24 390h202" stroke="#edf0f4" stroke-width="2"/>
  <text x="32" y="430" class="ui tiny muted" letter-spacing="1.4">TEACHER TOOLS</text>
  <text x="48" y="478" class="ui body muted">⚙</text><text x="73" y="478" class="ui body muted">Settings</text>
  <rect x="20" y="795" width="210" height="78" rx="14" fill="#f6f8fc"/>
  <circle cx="55" cy="834" r="20" fill="#f7d7b5"/><text x="55" y="840" text-anchor="middle" class="ui small">A</text>
  <text x="84" y="830" class="ui small" font-weight="700">Teacher Asha</text><text x="84" y="852" class="ui tiny muted">Grade 5</text>
  <!-- Top bar -->
  <text x="290" y="55" class="ui small muted">Monday, 23 November 2026</text>
  <rect x="1185" y="25" width="220" height="48" rx="12" fill="#fff" stroke="#e8ebf0" stroke-width="2"/>
  <circle cx="1213" cy="49" r="8" fill="#2f8f74"/><text x="1232" y="55" class="ui small">Offline pack ready</text>
  <!-- Header -->
  <text x="290" y="125" class="ui heading">Good morning, Teacher Asha 👋</text>
  <text x="290" y="158" class="ui body muted">Here’s a sample view of your class learning progress.</text>
  <rect x="1122" y="105" width="283" height="50" rx="11" fill="#fff" stroke="#e8ebf0" stroke-width="2"/>
  <text x="1144" y="137" class="ui small">Grade 5 · Mathematics</text><text x="1374" y="137" class="ui small muted">⌄</text>
  <!-- KPI cards -->
  <rect x="290" y="190" width="255" height="126" rx="16" class="card"/>
  <text x="314" y="225" class="ui small muted">Students in class</text><text x="314" y="278" class="ui heading">24</text>
  <circle cx="498" cy="250" r="24" class="lightblue"/><text x="498" y="258" text-anchor="middle" class="ui medium" fill="#496fc3">♙</text>
  <rect x="565" y="190" width="255" height="126" rx="16" class="card"/>
  <text x="589" y="225" class="ui small muted">Practiced this week</text><text x="589" y="278" class="ui heading">18 <tspan class="small muted">of 24</tspan></text>
  <circle cx="773" cy="250" r="24" class="lightgreen"/><text x="773" y="258" text-anchor="middle" class="ui medium green">✓</text>
  <rect x="840" y="190" width="255" height="126" rx="16" class="card"/>
  <text x="864" y="225" class="ui small muted">Topic to revisit</text><text x="864" y="275" class="ui medium">Fractions</text>
  <circle cx="1048" cy="250" r="24" class="lightorange"/><text x="1048" y="258" text-anchor="middle" class="ui medium orange">!</text>
  <rect x="1115" y="190" width="290" height="126" rx="16" class="card"/>
  <text x="1139" y="225" class="ui small muted">Last sync</text><text x="1139" y="275" class="ui medium">Today, 10:15 AM</text>
  <circle cx="1356" cy="250" r="24" class="lightgreen"/><path d="M1345 250a12 12 0 0 1 20-8m0-7v10h-10m20 5a12 12 0 0 1-20 8m0 7v-10h10" fill="none" stroke="#2f8f74" stroke-width="2.5"/>
  <!-- Main chart -->
  <rect x="290" y="342" width="700" height="300" rx="16" class="card"/>
  <text x="316" y="382" class="ui medium">Weekly practice</text><text x="316" y="407" class="ui small muted">Completed activities · illustrative sample</text>
  <path d="M354 570h590M354 520h590M354 470h590M354 420h590" stroke="#edf0f4" stroke-width="2"/>
  <text x="326" y="575" class="ui tiny muted">0</text><text x="319" y="525" class="ui tiny muted">5</text><text x="312" y="475" class="ui tiny muted">10</text><text x="312" y="425" class="ui tiny muted">15</text>
  <path d="M385 548l105-45 105 22 105-73 105 37 105-63" fill="none" stroke="#496fc3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" stroke="#496fc3" stroke-width="4"><circle cx="385" cy="548" r="7"/><circle cx="490" cy="503" r="7"/><circle cx="595" cy="525" r="7"/><circle cx="700" cy="452" r="7"/><circle cx="805" cy="489" r="7"/><circle cx="910" cy="426" r="7"/></g>
  <g class="ui tiny muted" text-anchor="middle"><text x="385" y="603">Mon</text><text x="490" y="603">Tue</text><text x="595" y="603">Wed</text><text x="700" y="603">Thu</text><text x="805" y="603">Fri</text><text x="910" y="603">Sat</text></g>
  <!-- Topic card -->
  <rect x="1010" y="342" width="395" height="300" rx="16" class="card"/>
  <text x="1036" y="382" class="ui medium">Class understanding</text><text x="1036" y="407" class="ui small muted">Based on recent practice</text>
  <text x="1036" y="457" class="ui small">Fractions</text><text x="1368" y="457" text-anchor="end" class="ui small muted">Needs review</text>
  <rect x="1036" y="470" width="342" height="10" rx="5" fill="#f1f2f5"/><rect x="1036" y="470" width="170" height="10" rx="5" fill="#e88c3a"/>
  <text x="1036" y="520" class="ui small">Multiplication</text><text x="1368" y="520" text-anchor="end" class="ui small muted">Good progress</text>
  <rect x="1036" y="533" width="342" height="10" rx="5" fill="#f1f2f5"/><rect x="1036" y="533" width="270" height="10" rx="5" fill="#2f8f74"/>
  <text x="1036" y="583" class="ui small">Measurement</text><text x="1368" y="583" text-anchor="end" class="ui small muted">In progress</text>
  <rect x="1036" y="596" width="342" height="10" rx="5" fill="#f1f2f5"/><rect x="1036" y="596" width="220" height="10" rx="5" fill="#496fc3"/>
  <!-- Bottom cards -->
  <rect x="290" y="666" width="700" height="192" rx="16" class="card"/>
  <text x="316" y="706" class="ui medium">Students to check in with</text><text x="316" y="733" class="ui small muted">Illustrative names and learning signals</text>
  <circle cx="342" cy="777" r="17" fill="#f8e5c9"/><text x="342" y="782" text-anchor="middle" class="ui tiny">R</text><text x="374" y="782" class="ui small">Rani</text><text x="560" y="782" class="ui small muted">Try another fractions activity</text><text x="940" y="782" text-anchor="end" class="ui small orange">Review</text>
  <path d="M316 802h648" stroke="#edf0f4" stroke-width="2"/>
  <circle cx="342" cy="830" r="17" fill="#dcecf4"/><text x="342" y="835" text-anchor="middle" class="ui tiny">M</text><text x="374" y="835" class="ui small">Manoj</text><text x="560" y="835" class="ui small muted">Resume saved practice</text><text x="940" y="835" text-anchor="end" class="ui small blue">View</text>
  <rect x="1010" y="666" width="395" height="192" rx="16" class="card"/>
  <text x="1036" y="706" class="ui medium">Offline lesson packs</text><text x="1036" y="733" class="ui small muted">Ready on this device</text>
  <rect x="1036" y="758" width="64" height="64" rx="12" class="lightblue"/>
  <path d="M1053 774h30v32h-30zM1059 782h18m-18 7h18m-18 7h12" fill="none" stroke="#496fc3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1118" y="782" class="ui small" font-weight="700">Grade 5 · Maths</text><text x="1118" y="806" class="ui tiny muted">Fractions · 3 short activities</text>
  <circle cx="1366" cy="790" r="15" class="lightgreen"/><path d="M1359 790l5 5 9-11" fill="none" stroke="#2f8f74" stroke-width="2.5" stroke-linecap="round"/>
  <text x="290" y="884" class="ui tiny muted">CONCEPT MOCKUP · SAMPLE DATA ONLY · PROPOSED FEATURES, NOT A WORKING PRODUCT</text>
</svg>
